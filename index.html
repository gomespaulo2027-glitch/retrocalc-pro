<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17120f"><title>RETROCALC PRO</title><style>*{box-sizing:border-box}:root{--bg:#120e0c;--p:#1d1612;--g:#d6a84f;--g2:#f1cf7a;--t:#f4ead7;--m:#a99b87}body{margin:0;background:radial-gradient(circle at top,#302218,#100c0a 60%);color:var(--t);font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:12px}.app{width:100%;max-width:470px}header{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 14px}.logo{font-weight:900;letter-spacing:2px;color:var(--g2)}.logo small{display:block;font-size:9px;color:var(--m);letter-spacing:3px;margin-top:3px}.badge{font-size:10px;color:#7fa879;border:1px solid #42603f;padding:5px 8px;border-radius:20px}.screen{background:linear-gradient(145deg,#211812,#100d0b);border:1px solid #59432b;border-radius:22px;padding:18px;box-shadow:inset 0 1px #80643e,0 12px 30px #0008;margin-bottom:12px}.expression{height:24px;color:var(--m);font-size:14px;text-align:right;overflow:hidden}.display{font-size:38px;font-weight:700;text-align:right;white-space:nowrap;overflow:auto;margin-top:5px;color:#fff7e9}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.tab{border:1px solid #4c3927;background:#211813;color:var(--m);border-radius:10px;padding:9px 4px;font-weight:bold}.tab.active{color:#17110d;background:var(--g);border-color:var(--g2)}.panel{display:none}.panel.active{display:block}.memory{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}button,input,select{font:inherit;border:0;outline:0}button{min-height:56px;border-radius:15px;color:var(--t);background:linear-gradient(145deg,#30231b,#1b1410);border:1px solid #4c3827;box-shadow:inset 0 1px #604832,0 3px 0 #0b0807;cursor:pointer;font-weight:bold}.memory button{min-height:38px;font-size:12px}.operator{color:var(--g2)}.equal{background:linear-gradient(145deg,#d7aa51,#9a702b);color:#17100a}.danger{color:#e59a8e}.scientific{font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.card{background:var(--p);border:1px solid #493727;border-radius:16px;padding:12px;margin-bottom:9px}.card h3{margin:0 0 10px;font-size:13px;color:var(--g2)}input,select{width:100%;background:#120e0c;color:var(--t);border:1px solid #4b3828;border-radius:10px;padding:11px;margin-bottom:7px}.result{font-size:18px;color:var(--g2);font-weight:bold;text-align:center;padding:8px}.history{max-height:180px;overflow:auto;font-size:13px;color:var(--m)}.history div{padding:8px 4px;border-bottom:1px solid #33261c}.empty{text-align:center;padding:25px;color:#756958}@media(max-width:360px){body{padding:7px}.display{font-size:31px}button{min-height:50px}.scientific{font-size:11px}}</style></head><body><div class="app"><header><div class="logo">RETROCALC PRO<small>PRECISION • SIMPLE • RETRO</small></div><div class="badge">OFFLINE</div></header><div class="screen"><div class="expression" id="expression"></div><div class="display" id="display">0</div></div><div class="tabs"><button class="tab active" onclick="tab('calc',this)">CALC</button><button class="tab" onclick="tab('convert',this)">CONVERTER</button><button class="tab" onclick="tab('finance',this)">FINANCE</button></div><section id="calc" class="panel active"><div class="memory"><button onclick="memoryClear()">MC</button><button onclick="memoryRecall()">MR</button><button onclick="memoryAdd()">M+</button><button onclick="memorySub()">M−</button><button onclick="memorySave()">MS</button></div><div class="grid"><button onclick="scientific('sin')">sin</button><button onclick="scientific('cos')">cos</button><button onclick="scientific('tan')">tan</button><button onclick="scientific('sqrt')">√</button><button onclick="scientific('ln')">ln</button><button onclick="scientific('log')">log</button><button onclick="add('π')">π</button><button onclick="add('e')">e</button><button onclick="clearAll()" class="danger">AC</button><button onclick="backspace()">⌫</button><button onclick="add('%')" class="operator">%</button><button onclick="add('÷')" class="operator">÷</button><button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button onclick="add('×')" class="operator">×</button><button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button onclick="add('−')" class="operator">−</button><button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button onclick="add('+')" class="operator">+</button><button onclick="toggleSign()">±</button><button onclick="add('0')">0</button><button onclick="add('.')">.</button><button onclick="calculate()" class="equal">=</button></div><div class="row"><button onclick="scientific('factorial')">x!</button><button onclick="scientific('rand')">RAND</button></div></section><section id="convert" class="panel"><div class="card"><h3>CONVERSOR</h3><select id="unitType" onchange="updateUnits()"><option value="length">Comprimento</option><option value="weight">Peso</option><option value="volume">Volume</option><option value="area">Área</option><option value="temperature">Temperatura</option><option value="time">Tempo</option></select><input id="convValue" type="number" placeholder="Valor"><div class="row"><select id="from"></select><select id="to"></select></div><button onclick="convert()" style="width:100%">CONVERTER</button><div class="result" id="convResult">—</div></div></section><section id="finance" class="panel"><div class="card"><h3>JUROS COMPOSTOS</h3><input id="capital" type="number" placeholder="Capital inicial"><input id="rate" type="number" placeholder="Taxa (%)"><input id="periods" type="number" placeholder="Períodos"><button onclick="compound()" style="width:100%">CALCULAR</button><div class="result" id="compoundResult">—</div></div><div class="card"><h3>LUCRO / MARGEM / MARKUP</h3><input id="cost" type="number" placeholder="Custo"><input id="sale" type="number" placeholder="Preço de venda"><button onclick="profit()" style="width:100%">ANALISAR</button><div class="result" id="profitResult">—</div></div></section><div class="card"><h3>HISTÓRICO <button onclick="clearHistory()" style="float:right;min-height:25px;padding:3px 8px;font-size:10px">LIMPAR</button></h3><div id="history" class="history"></div></div></div><script>let current='',memory=+localStorage.getItem('rc_memory')||0,$=id=>document.getElementById(id),refresh=()=>$('display').textContent=current||'0';function add(v){if(v==='π')v=Math.PI;if(v==='e')v=Math.E;current+=v;refresh()}function clearAll(){current='';$('expression').textContent='';refresh()}function backspace(){current=current.slice(0,-1);refresh()}function toggleSign(){if(current)current=current[0]==='-'?current.slice(1):'-'+current;refresh()}function calculate(){try{let s=current.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+\-*/().\s]+$/.test(s))throw 0;let r=Function('return '+s)();if(!Number.isFinite(r))throw 0;$('expression').textContent=current+' =';addHistory(current+' = '+r);current=String(Number(r.toPrecision(12)));refresh()}catch{$('display').textContent='Erro'}}function scientific(t){try{let x=+(current||0),r;if(t==='sin')r=Math.sin(x*Math.PI/180);if(t==='cos')r=Math.cos(x*Math.PI/180);if(t==='tan')r=Math.tan(x*Math.PI/180);if(t==='sqrt')r=Math.sqrt(x);if(t==='ln')r=Math.log(x);if(t==='log')r=Math.log10(x);if(t==='rand')r=Math.random();if(t==='factorial'){if(x<0||x>170||x%1)throw 0;r=1;for(let i=2;i<=x;i++)r*=i}if(!Number.isFinite(r))throw 0;addHistory(t+'('+x+') = '+r);current=String(Number(r.toPrecision(12)));refresh()}catch{$('display').textContent='Erro'}}function memorySave(){memory=+(current||0);localStorage.rc_memory=memory}function memoryRecall(){current+=memory;refresh()}function memoryClear(){memory=0;localStorage.rc_memory=0}function memoryAdd(){memory+=(+current||0);localStorage.rc_memory=memory}function memorySub(){memory-=(+current||0);localStorage.rc_memory=memory}function tab(id,el){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');el.classList.add('active')}function addHistory(v){let h=JSON.parse(localStorage.rc_history||'[]');h.unshift(v);localStorage.rc_history=JSON.stringify(h.slice(0,30));renderHistory()}function renderHistory(){let h=JSON.parse(localStorage.rc_history||'[]');$('history').innerHTML=h.length?h.map(x=>'<div>'+x+'</div>').join(''):'<div class="empty">Nenhum cálculo ainda</div>'}function clearHistory(){localStorage.removeItem('rc_history');renderHistory()}const units={length:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048},weight:{kg:1,g:.001,mg:.000001,lb:.453592},volume:{l:1,ml:.001,m3:1000,gal:3.78541},area:{m2:1,km2:1e6,cm2:.0001,ft2:.092903},time:{s:1,min:60,h:3600,day:86400}};function updateUnits(){let t=$('unitType').value,l=t==='temperature'?['C','F','K']:Object.keys(units[t]);$('from').innerHTML=$('to').innerHTML=l.map(x=>'<option>'+x+'</option>').join('')}function convert(){let t=$('unitType').value,v=+$('convValue').value,a=$('from').value,b=$('to').value,r;if(!Number.isFinite(v))return;if(t==='temperature'){let c=a==='C'?v:a==='F'?(v-32)*5/9:v-273.15;r=b==='C'?c:b==='F'?c*9/5+32:c+273.15}else r=v*units[t][a]/units[t][b];$('convResult').textContent=Number(r.toPrecision(10))}function compound(){let c=+capital.value,r=+rate.value/100,n=+periods.value,x=c*Math.pow(1+r,n);$('compoundResult').textContent=isFinite(x)?'Montante: '+x.toFixed(2):'Valores inválidos'}function profit(){let c=+cost.value,s=+sale.value;if(c<0||s<0)return;$('profitResult').innerHTML='Lucro: '+(s-c).toFixed(2)+'<br>Margem: '+(s?((s-c)/s*100).toFixed(2):0)+'%<br>Markup: '+(c?((s-c)/c*100).toFixed(2):0)+'%'}document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(/[0-9.]/.test(e.key))add(e.key);else if(['+','-','*','/'].includes(e.key))add(e.key==='*'?'×':e.key==='/'?'÷':e.key);else if(e.key==='Enter'||e.key==='=')calculate();else if(e.key==='Backspace')backspace();else if(e.key==='Escape')clearAll()});updateUnits();renderHistory();refresh();</script></body></html>
